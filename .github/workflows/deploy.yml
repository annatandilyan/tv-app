name: Deploy React App to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no ec2-user@54.87.227.86 << 'EOF'
            sudo rm -rf /usr/share/nginx/html/*
          EOF

          scp -r dist/* ec2-user@54.87.227.86:/tmp/dist/

          ssh -o StrictHostKeyChecking=no ec2-user@54.87.227.86 << 'EOF'
            sudo cp -r /tmp/dist/* /usr/share/nginx/html/
            sudo systemctl restart nginx
          EOF